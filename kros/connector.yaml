        default: null
        description: Datum platby do (YYYY-MM-DD).
        title: Payment Date To
      account_id:
        anyOf:
        - maximum: 9007199254740991
          minimum: 1
          type: integer
        - type: 'null'
        default: null
        description: Id finančního účtu.
        title: Account Id
      external_id:
        anyOf:
        - maxLength: 64
          minLength: 1
          type: string
        - type: 'null'
        default: null
