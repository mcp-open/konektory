schema_version: 1
slug: gopay
name: GoPay
version: 1.0.0
category: payments
summary: Čtecí přístup ke stavu plateb, refundací a platebních metod GoPay.
auth:
  type: api_key
  credential_delivery: core_signed_body_exact_version
credentials:
- key: goid
  required: true
  secret: true
- key: client_id
  required: true
  secret: true
- key: client_secret
  required: true
  secret: true
- key: environment
  required: true
  secret: true
- key: pii_key
  required: true
  secret: true
capabilities:
  default_read_only: true
  supports_write: false
  supports_test: true
  pii_pseudonymization: configurable
  privacy_modes: [strict, balanced, plain]
  default_privacy_mode: strict
runtime:
  transport: internal_http
  invocation_path: /internal/v1/invoke
  test_connection_path: /internal/v1/test-connection
  health_live_path: /health/live
  health_ready_path: /health/ready
  port_env: OPENMCP_HTTP_ADDR
  internal_auth_env: OPENMCP_INTERNAL_TOKEN
  internal_auth_file_env: OPENMCP_INTERNAL_TOKEN_FILE
  internal_auth_source_policy: exactly_one
  internal_auth: hmac_sha256_compact_v1
  internal_auth_max_ttl_seconds: 60
  internal_auth_replay_store: valkey_required_in_production
egress:
  hosts:
  - gate.gopay.cz
  - gw.sandbox.gopay.com
  port: 443
  path_prefix: /api
  methods:
  - GET
  - POST
tools:
- name: get_payment
  description: Stav a detail platby GoPay podle ID platby (stav, částka, měna, metoda,
    plátce).
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      payment_id:
        maximum: 9007199254740991
        minimum: 1
        title: Payment Id
        type: integer
    required:
    - payment_id
    title: PaymentID
    type: object
- name: list_refunds
  description: Historie refundací platby GoPay podle ID platby.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      payment_id:
        maximum: 9007199254740991
        minimum: 1
        title: Payment Id
        type: integer
    required:
    - payment_id
    title: PaymentID
    type: object
- name: get_card
  description: Detail uložené platební karty GoPay podle card_id (maskovaný PAN, stav,
    expirace).
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      card_id:
        maximum: 9007199254740991
        minimum: 1
        title: Card Id
        type: integer
    required:
    - card_id
    title: CardID
    type: object
- name: list_payment_instruments
  description: Povolené platební metody a banky pro GoID instalace; volitelně jen
    pro jednu měnu.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      currency:
        anyOf:
        - enum:
          - CZK
          - EUR
          - PLN
          - USD
          - GBP
          - HUF
          - RON
          type: string
        - type: 'null'
        default: null
        title: Currency
    title: PaymentInstruments
    type: object
