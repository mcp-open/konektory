schema_version: 1
slug: abraflexi
name: ABRA Flexi
version: 1.0.0
category: erp
summary: Čtecí přístup k evidencím ABRA Flexi Cloud.
auth:
  type: api_key
  credential_delivery: core_signed_body_exact_version
credentials:
- key: api_url
  required: true
  secret: true
- key: username
  required: true
  secret: true
- key: password
  required: true
  secret: true
- key: company
  required: true
  secret: true
- key: pii_key
  required: true
  secret: true
capabilities:
  default_read_only: true
  supports_write: false
  supports_test: true
  pii_pseudonymization: configurable
  privacy_modes: [strict, balanced, plain]
  default_privacy_mode: strict
runtime:
  transport: internal_http
  invocation_path: /internal/v1/invoke
  test_connection_path: /internal/v1/test-connection
  health_live_path: /health/live
  health_ready_path: /health/ready
  port_env: OPENMCP_HTTP_ADDR
  internal_auth_env: OPENMCP_INTERNAL_TOKEN
  internal_auth_file_env: OPENMCP_INTERNAL_TOKEN_FILE
  internal_auth_source_policy: exactly_one
  internal_auth: hmac_sha256_compact_v1
  internal_auth_max_ttl_seconds: 60
  internal_auth_replay_store: valkey_required_in_production
egress:
  host_pattern: '{tenant}.flexibee.eu'
  port: 5434
  path_prefix: /c
  methods:
  - GET
tools:
- name: get_company_info
  description: Informace pouze o firmě vázané na instalaci.
  read_only: true
  input_schema:
    additionalProperties: false
    properties: {}
    title: Input
    type: object
- name: list_companies
  description: Vrátí pouze vázanou firmu; neenumeruje ostatní databáze.
  read_only: true
  input_schema:
    additionalProperties: false
    properties: {}
    title: Input
    type: object
- name: list_evidences
  description: Pevný katalog podporovaných read-only evidencí.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      area:
        anyOf:
        - enum:
          - prodej
          - typy
          - sklad
          - partneri
          - ucetnictvi
          - ciselniky
          type: string
        - type: 'null'
        default: null
        title: Area
    title: ListEvidences
    type: object
- name: list_records
  description: Stránka evidence se strukturovanými AND filtry.
  read_only: true
  input_schema:
    $defs:
      Filter:
        additionalProperties: false
        properties:
          field:
            pattern: ^[A-Za-z][A-Za-z0-9]{0,40}(\.[A-Za-z][A-Za-z0-9]{0,40})?$
            title: Field
            type: string
          op:
            enum:
            - eq
            - neq
            - lt
            - lte
            - gt
            - gte
            - like
            - begins
            - ends
            - is_null
            - is_not_null
            - is_true
            - is_false
            title: Op
            type: string
          value:
            anyOf:
            - type: string
            - type: integer
            - type: number
            - type: boolean
            - type: 'null'
            default: null
            title: Value
        required:
        - field
        - op
        title: Filter
        type: object
    additionalProperties: false
    properties:
      evidence:
        enum:
        - faktura-vydana
        - faktura-vydana-polozka
        - typ-faktury-vydane
        - objednavka-prijata
        - objednavka-prijata-polozka
        - skladovy-pohyb
        - skladovy-pohyb-polozka
        - skladova-karta
        - stav-skladu-k-datu
        - cenik
        - sklad
        - adresar
        - kontakt
        - ucetni-denik
        - mena
        title: Evidence
        type: string
      limit:
        default: 50
        maximum: 100
        minimum: 1
        title: Limit
        type: integer
      offset:
        default: 0
        maximum: 10000
        minimum: 0
        title: Offset
        type: integer
      filters:
        items:
          $ref: '#/$defs/Filter'
        maxItems: 8
        title: Filters
        type: array
      order:
        anyOf:
        - pattern: ^[A-Za-z][A-Za-z0-9]{0,40}@[AD]$
          type: string
        - type: 'null'
        default: null
        title: Order
      fields:
        items:
          pattern: ^[A-Za-z][A-Za-z0-9]{0,40}(\.[A-Za-z][A-Za-z0-9]{0,40})?$
          type: string
        maxItems: 20
        title: Fields
        type: array
    required:
    - evidence
    title: ListRecords
    type: object
- name: get_record
  description: Detail evidence; pouze položky a vazby, žádné soubory.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      evidence:
        enum:
        - faktura-vydana
        - faktura-vydana-polozka
        - typ-faktury-vydane
        - objednavka-prijata
        - objednavka-prijata-polozka
        - skladovy-pohyb
        - skladovy-pohyb-polozka
        - skladova-karta
        - stav-skladu-k-datu
        - cenik
        - sklad
        - adresar
        - kontakt
        - ucetni-denik
        - mena
        title: Evidence
        type: string
      record_id:
        maxLength: 128
        minLength: 1
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.:+-]*$
        title: Record Id
        type: string
      fields:
        items:
          pattern: ^[A-Za-z][A-Za-z0-9]{0,40}(\.[A-Za-z][A-Za-z0-9]{0,40})?$
          type: string
        maxItems: 20
        title: Fields
        type: array
      relations:
        items:
          enum:
          - polozky
          - vazby
          type: string
        maxItems: 2
        title: Relations
        type: array
    required:
    - evidence
    - record_id
    title: GetRecord
    type: object
- name: sum_records
  description: Providerem vypočtený souhrn povolené evidence.
  read_only: true
  input_schema:
    $defs:
      Filter:
        additionalProperties: false
        properties:
          field:
            pattern: ^[A-Za-z][A-Za-z0-9]{0,40}(\.[A-Za-z][A-Za-z0-9]{0,40})?$
            title: Field
            type: string
          op:
            enum:
            - eq
            - neq
            - lt
            - lte
            - gt
            - gte
            - like
            - begins
            - ends
            - is_null
            - is_not_null
            - is_true
            - is_false
            title: Op
            type: string
          value:
            anyOf:
            - type: string
            - type: integer
            - type: number
            - type: boolean
            - type: 'null'
            default: null
            title: Value
        required:
        - field
        - op
        title: Filter
        type: object
    additionalProperties: false
    properties:
      evidence:
        enum:
        - faktura-vydana
        - objednavka-prijata
        - skladovy-pohyb
        title: Evidence
        type: string
      filters:
        items:
          $ref: '#/$defs/Filter'
        maxItems: 8
        title: Filters
        type: array
    required:
    - evidence
    title: SumRecords
    type: object
- name: get_evidence_properties
  description: Metadata polí povolené evidence.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      evidence:
        enum:
        - faktura-vydana
        - faktura-vydana-polozka
        - typ-faktury-vydane
        - objednavka-prijata
        - objednavka-prijata-polozka
        - skladovy-pohyb
        - skladovy-pohyb-polozka
        - skladova-karta
        - stav-skladu-k-datu
        - cenik
        - sklad
        - adresar
        - kontakt
        - ucetni-denik
        - mena
        title: Evidence
        type: string
    required:
    - evidence
    title: EvidenceInput
    type: object
- name: list_issued_invoices
  description: Vydané faktury, datum a stav úhrady.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      limit:
        default: 50
        maximum: 100
        minimum: 1
        title: Limit
        type: integer
      offset:
        default: 0
        maximum: 10000
        minimum: 0
        title: Offset
        type: integer
      date_from:
        anyOf:
        - pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          type: string
        - type: 'null'
        default: null
        title: Date From
      date_to:
        anyOf:
        - pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          type: string
        - type: 'null'
        default: null
        title: Date To
      order:
        anyOf:
        - pattern: ^[A-Za-z][A-Za-z0-9]{0,40}@[AD]$
          type: string
        - type: 'null'
        default: null
        title: Order
      payment_status:
        anyOf:
        - enum:
          - uhrazeno
          - castUhr
          - neuhrazeno
          type: string
        - type: 'null'
        default: null
        title: Payment Status
    title: Invoices
    type: object
- name: get_issued_invoice
  description: Detail vydané faktury, volitelně s položkami.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      invoice_id:
        maxLength: 128
        minLength: 1
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.:+-]*$
        title: Invoice Id
        type: string
      include_items:
        default: true
        title: Include Items
        type: boolean
    required:
    - invoice_id
    title: Invoice
    type: object
- name: list_invoice_types
  description: Stránka typů vydaných faktur.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      limit:
        default: 50
        maximum: 100
        minimum: 1
        title: Limit
        type: integer
      offset:
        default: 0
        maximum: 10000
        minimum: 0
        title: Offset
        type: integer
    title: Page
    type: object
- name: get_invoice_journal
  description: Účetní deník konkrétního číselného ID faktury.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      limit:
        default: 50
        maximum: 100
        minimum: 1
        title: Limit
        type: integer
      offset:
        default: 0
        maximum: 10000
        minimum: 0
        title: Offset
        type: integer
      invoice_id:
        pattern: ^[0-9]{1,15}$
        title: Invoice Id
        type: string
    required:
    - invoice_id
    title: Journal
    type: object
- name: list_received_orders
  description: Přijaté objednávky s datovým filtrem.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      limit:
        default: 50
        maximum: 100
        minimum: 1
        title: Limit
        type: integer
      offset:
        default: 0
        maximum: 10000
        minimum: 0
        title: Offset
        type: integer
      date_from:
        anyOf:
        - pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          type: string
        - type: 'null'
        default: null
        title: Date From
      date_to:
        anyOf:
        - pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          type: string
        - type: 'null'
        default: null
        title: Date To
      order:
        anyOf:
        - pattern: ^[A-Za-z][A-Za-z0-9]{0,40}@[AD]$
          type: string
        - type: 'null'
        default: null
        title: Order
    title: Documents
    type: object
- name: get_received_order
  description: Detail přijaté objednávky.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      order_id:
        maxLength: 128
        minLength: 1
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.:+-]*$
        title: Order Id
        type: string
      include_items:
        default: true
        title: Include Items
        type: boolean
    required:
    - order_id
    title: ReceivedOrder
    type: object
- name: list_stock_movements
  description: Pohyby za období; filtr skladu/směru po stránkách.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      limit:
        default: 50
        maximum: 100
        minimum: 1
        title: Limit
        type: integer
      offset:
        default: 0
        maximum: 10000
        minimum: 0
        title: Offset
        type: integer
      date_from:
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        title: Date From
        type: string
      date_to:
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        title: Date To
        type: string
      order:
        anyOf:
        - pattern: ^[A-Za-z][A-Za-z0-9]{0,40}@[AD]$
          type: string
        - type: 'null'
        default: null
        title: Order
      direction:
        anyOf:
        - enum:
          - prijem
          - vydej
          type: string
        - type: 'null'
        default: null
        title: Direction
      warehouse:
        anyOf:
        - maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9 _.:+-]+$
          type: string
        - type: 'null'
        default: null
        title: Warehouse
    required:
    - date_from
    - date_to
    title: Movements
    type: object
- name: get_stock_movement
  description: Detail skladového pohybu.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      movement_id:
        maxLength: 128
        minLength: 1
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.:+-]*$
        title: Movement Id
        type: string
      include_items:
        default: true
        title: Include Items
        type: boolean
    required:
    - movement_id
    title: Movement
    type: object
- name: get_stock_status
  description: Stav skladu k datu, explicitní sklad a stránkování.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      limit:
        default: 50
        maximum: 100
        minimum: 1
        title: Limit
        type: integer
      offset:
        default: 0
        maximum: 10000
        minimum: 0
        title: Offset
        type: integer
      date:
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        title: Date
        type: string
      warehouse:
        maxLength: 64
        minLength: 1
        pattern: ^[A-Za-z0-9 _.:+-]+$
        title: Warehouse
        type: string
    required:
    - date
    - warehouse
    title: Stock
    type: object
- name: list_products
  description: Ceník; lokální filtr nad stránkou, pokračuj přes next_offset.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      limit:
        default: 50
        maximum: 100
        minimum: 1
        title: Limit
        type: integer
      offset:
        default: 0
        maximum: 10000
        minimum: 0
        title: Offset
        type: integer
      name_contains:
        anyOf:
        - maxLength: 64
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Name Contains
      group:
        anyOf:
        - maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9 _.:+-]+$
          type: string
        - type: 'null'
        default: null
        title: Group
    title: Products
    type: object
- name: get_product
  description: Detail produktu podle číselného ID nebo bezpečného kódu.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      product_id:
        maxLength: 128
        minLength: 1
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.:+-]*$
        title: Product Id
        type: string
    required:
    - product_id
    title: Product
    type: object
