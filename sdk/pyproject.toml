[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openmcp-connector-runtime"
version = "0.1.0"
description = "Minimal internal HTTP runtime shared by OpenMCP MVP connectors"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.11.7",
  "valkey==6.1.1",
  "starlette==1.6.0",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = [
  "anyio==4.14.2",
  "httpx2==2.12.0",
  "mypy==2.3.1",
  "pytest==8.4.2",
  "ruff==0.16.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openmcp_connector_runtime = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["openmcp_connector_runtime"]
