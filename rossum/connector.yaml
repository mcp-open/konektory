schema_version: 1
slug: rossum
name: Rossum
version: 1.0.0
category: document_processing
summary: Čtecí přístup k frontám, anotacím a vytěženým datům Rossum.
auth:
  type: api_key
  credential_delivery: core_signed_body_exact_version
credentials:
- key: base_url
  required: true
  secret: true
- key: api_token
  required: true
  secret: true
- key: pii_key
  required: true
  secret: true
capabilities:
  default_read_only: true
  supports_write: false
  supports_test: true
  pii_pseudonymization: configurable
  privacy_modes: [strict, balanced, plain]
  default_privacy_mode: strict
runtime:
  transport: internal_http
  invocation_path: /internal/v1/invoke
  test_connection_path: /internal/v1/test-connection
  health_live_path: /health/live
  health_ready_path: /health/ready
  port_env: OPENMCP_HTTP_ADDR
  internal_auth_env: OPENMCP_INTERNAL_TOKEN
  internal_auth_file_env: OPENMCP_INTERNAL_TOKEN_FILE
  internal_auth_source_policy: exactly_one
  internal_auth: hmac_sha256_compact_v1
  internal_auth_max_ttl_seconds: 60
  internal_auth_replay_store: valkey_required_in_production
egress:
  host_pattern: '{tenant}.rossum.app'
  port: 443
  path_prefix: /api/v1
  methods:
  - GET
tools:
- name: list_workspaces
  description: Seznam workspaces organizace s filtrem názvu.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      page_size:
        default: 20
        maximum: 100
        minimum: 1
        title: Page Size
        type: integer
      cursor:
        anyOf:
        - maxLength: 1024
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Cursor
      name:
        anyOf:
        - maxLength: 128
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Name
      ordering:
        default: id
        enum:
        - id
        - -id
        - name
        - -name
        title: Ordering
        type: string
    title: WorkspaceList
    type: object
- name: list_queues
  description: Seznam front (queues) s filtrem workspace a názvu.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      page_size:
        default: 20
        maximum: 100
        minimum: 1
        title: Page Size
        type: integer
      cursor:
        anyOf:
        - maxLength: 1024
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Cursor
      workspace_id:
        anyOf:
        - maximum: 9007199254740991
          minimum: 1
          type: integer
        - type: 'null'
        default: null
        title: Workspace Id
      name:
        anyOf:
        - maxLength: 128
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Name
      ordering:
        default: id
        enum:
        - id
        - -id
        - name
        - -name
        - workspace
        - -workspace
        title: Ordering
        type: string
    title: QueueList
    type: object
- name: get_queue
  description: Detail fronty včetně nastavení automatizace a schématu.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      queue_id:
        maximum: 9007199254740991
        minimum: 1
        title: Queue Id
        type: integer
    required:
    - queue_id
    title: QueueID
    type: object
- name: list_annotations
  description: Stránka anotací (dokumentů ke zpracování) s filtrem fronty, stavu a
    fulltextu.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      page_size:
        default: 20
        maximum: 100
        minimum: 1
        title: Page Size
        type: integer
      cursor:
        anyOf:
        - maxLength: 1024
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Cursor
      queue_id:
        anyOf:
        - maximum: 9007199254740991
          minimum: 1
          type: integer
        - type: 'null'
        default: null
        title: Queue Id
      status:
        anyOf:
        - items:
            enum:
            - confirmed
            - created
            - deleted
            - exported
            - exporting
            - failed_export
            - failed_import
            - importing
            - in_workflow
            - postponed
            - purged
            - rejected
            - reviewing
            - split
            - to_review
            type: string
          maxItems: 15
          minItems: 1
          type: array
        - type: 'null'
        default: null
        title: Status
      search:
        anyOf:
        - maxLength: 128
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Search
      ordering:
        default: -created_at
        enum:
        - created_at
        - -created_at
        - modified_at
        - -modified_at
        - confirmed_at
        - -confirmed_at
        - exported_at
        - -exported_at
        - status
        - -status
        - queue
        - -queue
        title: Ordering
        type: string
    title: AnnotationList
    type: object
- name: get_annotation
  description: 'Detail anotace: stav, fronta, dokument, časové značky.'
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      annotation_id:
        maximum: 9007199254740991
        minimum: 1
        title: Annotation Id
        type: integer
    required:
    - annotation_id
    title: AnnotationID
    type: object
- name: get_annotation_content
  description: Vytěžená data anotace (sekce a datapointy) jen pro čtení.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      annotation_id:
        maximum: 9007199254740991
        minimum: 1
        title: Annotation Id
        type: integer
    required:
    - annotation_id
    title: AnnotationID
    type: object
- name: list_documents
  description: Seznam nahraných dokumentů s filtrem názvu souboru.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      page_size:
        default: 20
        maximum: 100
        minimum: 1
        title: Page Size
        type: integer
      cursor:
        anyOf:
        - maxLength: 1024
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Cursor
      original_file_name:
        anyOf:
        - maxLength: 128
          minLength: 1
          type: string
        - type: 'null'
        default: null
        title: Original File Name
      ordering:
        default: -arrived_at
        enum:
        - id
        - -id
        - arrived_at
        - -arrived_at
        - created_at
        - -created_at
        - original_file_name
        - -original_file_name
        title: Ordering
        type: string
    title: DocumentList
    type: object
