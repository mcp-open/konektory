          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
        - type: 'null'
        default: null
        description: Datum dokladu od (YYYY-MM-DD)
        title: Date From
      date_till:
        anyOf:
        - maxLength: 10
          minLength: 10
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
        - type: 'null'
        default: null
        description: Datum dokladu do (YYYY-MM-DD), nejvýše 366 dní
        title: Date Till
      company:
        anyOf:
        - maxLength: 255
          minLength: 1
          type: string
        - type: 'null'
        default: null
        description: Firma partnera (selectedCompanys)
        title: Company
      ico:
        anyOf:
        - pattern: ^[0-9]{6,15}$
