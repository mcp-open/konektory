schema_version: 1
slug: upgates
name: Upgates
version: 1.0.0
category: ecommerce
summary: Čtecí přístup k objednávkám, katalogu a nastavení e-shopu Upgates.
auth:
  type: api_key
  credential_delivery: core_signed_body_exact_version
credentials:
- key: api_url
  required: true
  secret: true
- key: api_login
  required: true
  secret: true
- key: api_key
  required: true
  secret: true
- key: pii_key
  required: true
  secret: true
capabilities:
  default_read_only: true
  supports_write: false
  supports_test: true
  pii_pseudonymization: configurable
  privacy_modes: [strict, balanced, plain]
  default_privacy_mode: strict
runtime:
  transport: internal_http
  invocation_path: /internal/v1/invoke
  test_connection_path: /internal/v1/test-connection
  health_live_path: /health/live
  health_ready_path: /health/ready
  port_env: OPENMCP_HTTP_ADDR
  internal_auth_env: OPENMCP_INTERNAL_TOKEN
  internal_auth_file_env: OPENMCP_INTERNAL_TOKEN_FILE
  internal_auth_source_policy: exactly_one
  internal_auth: hmac_sha256_compact_v1
  internal_auth_max_ttl_seconds: 60
  internal_auth_replay_store: valkey_required_in_production
egress:
  host_pattern: '{tenant}.admin.upgates.com'
  port: 443
  path_prefix: /api/v2
  methods:
  - GET
tools:
- name: list_orders
  description: 'Seznam objednávek s filtrováním a stránkováním (s omezením velikosti
    odpovědi).


    Data zákazníka jsou před opuštěním konektoru pseudonymizována.'
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      order_number:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Konkrétní číslo objednávky
        title: Order Number
      creation_time_from:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Od data YYYY-MM-DD
        title: Creation Time From
      creation_time_to:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Do data YYYY-MM-DD
        title: Creation Time To
      last_update_time_from:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Filtrovat objednávky aktualizované od tohoto data (YYYY-MM-DD)
        title: Last Update Time From
      paid_yn:
        anyOf:
        - type: boolean
        - type: 'null'
        default: null
        description: Filtrovat podle stavu zaplacení
        title: Paid Yn
      status:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Filtrovat podle názvu stavu objednávky
        title: Status
      status_id:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        description: Filtrovat podle ID stavu objednávky
        title: Status Id
      email:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Filtrovat podle e-mailu zákazníka
        title: Email
      phone:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Filtrovat podle telefonu zákazníka (formát MSISDN)
        title: Phone
      external_order_number:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Filtrovat podle externího čísla objednávky
        title: External Order Number
      language:
        anyOf:
        - maxLength: 2
          minLength: 2
          type: string
        - type: 'null'
        default: null
        description: Jazyk ISO 639-1
        title: Language
      page:
        default: 1
        description: Číslo stránky (od 1)
        maximum: 10000
        minimum: 1
        title: Page
        type: integer
      order_by:
        default: creation_time
        description: 'Řadit podle pole: creation_time | last_update_time'
        title: Order By
        type: string
      order_dir:
        default: desc
        description: 'Směr řazení: asc | desc'
        title: Order Dir
        type: string
    title: list_ordersInput
    type: object
- name: get_order_history
  description: Historie konkrétní objednávky. Data zákazníka jsou pseudonymizována.
  read_only: true
  input_schema:
    additionalProperties: false
    properties:
      order_number:
        description: Číslo objednávky
        title: Order Number
        type: string
    required:
