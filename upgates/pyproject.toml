[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openmcp-connector-upgates"
version = "1.0.0"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
description = "OpenMCP read-only upgates connector runtime"
requires-python = ">=3.12"
dependencies = [
  "openmcp-connector-runtime==0.1.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "PyYAML==6.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["connector_upgates"]
